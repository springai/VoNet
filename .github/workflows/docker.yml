name: docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate SSO test Compose configuration
        run: docker compose -f docker-compose.sso-test.yml config --quiet

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Pull BuildKit with retry
        run: bash scripts/ci-pull-image.sh "$BUILDKIT_IMAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build ${{ matrix.platform }} smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: vonet-smoke:${{ matrix.arch }}
          build-args: |
            VERSION=0.0.0-smoke
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha

      - name: Verify ${{ matrix.platform }} full migration and schema 34 restore cleanup
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/vonet-auth-restore-smoke"
          mkdir -p \
            "$smoke/full" \
            "$smoke/restore-migrate" \
            "$smoke/restore-cleanup"

          printf '%s\n' smoke-password | docker run --rm -i \
            --platform '${{ matrix.platform }}' \
            --user "$(id -u):$(id -g)" \
            --volume "$smoke:/smoke" \
            --entrypoint /opt/vonet/bin/vonet \
            vonet-smoke:${{ matrix.arch }} \
            bootstrap-admin --database /smoke/full/vonet.db
          python3 scripts/ci/auth_restore_smoke.py assert-full \
            "$smoke/full/vonet.db"

          python3 scripts/ci/auth_restore_smoke.py prepare \
            --source "$smoke/full/vonet.db" \
            --output "$smoke/restore-migrate/vonet.db"
          python3 scripts/ci/auth_restore_smoke.py prepare \
            --source "$smoke/full/vonet.db" \
            --output "$smoke/restore-cleanup/vonet.db"
          python3 scripts/ci/auth_restore_smoke.py assert-schema34 \
            "$smoke/restore-migrate/vonet.db"
          python3 scripts/ci/auth_restore_smoke.py assert-schema34 \
            "$smoke/restore-cleanup/vonet.db"

          printf '%s\n' smoke-password | docker run --rm -i \
            --platform '${{ matrix.platform }}' \
            --user "$(id -u):$(id -g)" \
            --volume "$smoke:/smoke" \
            --entrypoint /opt/vonet/bin/vonet \
            vonet-smoke:${{ matrix.arch }} \
            bootstrap-admin --database /smoke/restore-migrate/vonet.db
          python3 scripts/ci/auth_restore_smoke.py assert-migrated \
            "$smoke/restore-migrate/vonet.db"

          docker run --rm \
            --platform '${{ matrix.platform }}' \
            --user "$(id -u):$(id -g)" \
            --volume "$smoke:/smoke" \
            --entrypoint /opt/vonet/bin/vonet \
            vonet-smoke:${{ matrix.arch }} \
            auth-cleanup --no-migrate \
            --database /smoke/restore-cleanup/vonet.db
          python3 scripts/ci/auth_restore_smoke.py assert-cleaned \
            "$smoke/restore-cleanup/vonet.db"

      - name: Verify ${{ matrix.platform }} runtime, QMI, and smart-card stack
        run: |
          docker run --rm --platform '${{ matrix.platform }}' \
            vonet-smoke:${{ matrix.arch }} version
          docker run --rm --platform '${{ matrix.platform }}' \
            --entrypoint /bin/sh vonet-smoke:${{ matrix.arch }} -c \
            'command -v qmicli && command -v qmi-network && command -v pcscd && test -d /usr/lib/pcsc/drivers'

  build-and-push:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lowercase repository owner for ghcr.io
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Derive version from tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi
          echo "build_time=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Pull BuildKit with retry
        run: bash scripts/ci-pull-image.sh "$BUILDKIT_IMAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
