<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" style="display: block; margin: auto;">
  <defs>
    <!-- 图标金色渐变 -->
    <linearGradient id="vnGoldLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- 图标金色发光模糊滤镜 -->
    <filter id="vnIconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 精准居中组：将原图形中心点精准对齐到 512, 512，并放大到画布边界 -->
  <g transform="translate(512, 512) scale(2) translate(-512, -512)">
    <g transform="translate(512, 512)">
      <g transform="translate(-416, -520)" fill="none" stroke="url(#vnGoldLine)" stroke-width="35.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#vnIconGlow)">
        <!-- 主 V 形线框 -->
        <path d="M224 352 L352 608 L416 448 L480 608 L608 352"/>
        <!-- 底部圆弧 -->
        <path d="M288 640 Q416 720 544 640" stroke-width="32"/>
        <!-- 信号弧线 -->
        <path d="M160 512 L224 544" stroke-width="25.6"/>
        <path d="M672 512 L608 544" stroke-width="25.6"/>
        <!-- 两个点 -->
        <circle cx="352" cy="480" r="19.2" fill="url(#vnGoldLine)" stroke="none"/>
        <circle cx="480" cy="480" r="19.2" fill="url(#vnGoldLine)" stroke="none"/>
      </g>
    </g>
  </g>
</svg>
