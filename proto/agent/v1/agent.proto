syntax = "proto3";

package vonet.agent.v1;

option go_package = "vonet/internal/agentproto;agentproto";

message Heartbeat {
  int64 unix_time = 1;
  string protocol_version = 2;
  uint64 sequence = 3;
  int64 snapshot_generation = 4;
}

message DeviceSnapshot {
  string device_id = 1;
  string name = 2;
  string hardware_kind = 3;
  bool discovered = 4;
  string payload_json = 5;
}

message HardwareSnapshot {
  repeated DeviceSnapshot devices = 1;
  int64 captured_at = 2;
  string command_id = 3;
}

message CardProfile {
  string reader_id = 1;
  string iccid = 2;
  string imsi = 3;
  string provisioned_imsi = 4;
  uint32 mnc_length = 5;
  string smsc = 6;
  string spn = 7;
  bytes usim_aid = 8;
  string hardware_generation = 9;
  string command_id = 10;
  string msisdn = 11;
  string gid1 = 12;
  string gid2 = 13;
  bytes atr = 14;
  bool pin_required = 15;
  int32 pin_tries = 16;
  string card_generation = 17;
}

message SimSession {
  string session_id = 1;
  string reader_id = 2;
  string iccid = 3;
  string application = 4;
  int64 expires_at = 5;
  string command_id = 6;
  string hardware_generation = 7;
  string card_generation = 8;
  string agent_id = 9;
}

message AkaChallenge {
  bytes rand = 1;
  bytes autn = 2;
  string session_id = 3;
  string challenge_id = 4;
}

message AkaResult {
  bytes res = 1;
  bytes ck = 2;
  bytes ik = 3;
  bytes auts = 4;
  bool synchronization_failure = 5;
  string command_id = 6;
  string session_id = 7;
  string challenge_id = 8;
}

message CommandProgress {
  string command_id = 1;
  string stage = 2;
  string message = 3;
  int64 unix_time = 4;
  int32 percent = 5;
}

message CommandResult {
  string command_id = 1;
  bool success = 2;
  string error_code = 3;
  string error_message = 4;
  string payload_json = 5;
  bool terminal = 6;
  int64 completed_at = 7;
}

message AgentHello {
  string agent_id = 1;
  string protocol_version = 2;
  repeated string capabilities = 3;
  string version = 4;
  uint64 instance_id = 5;
}

message DeviceStatusEvent {
  string device_id = 1;
  string status_json = 2;
  int64 captured_at = 3;
}

message PINStatus {
  string reader_id = 1;
  bool required = 2;
  int32 tries = 3;
  bool puk_required = 4;
  string command_id = 5;
}

message PINCommand {
  string command_id = 1;
  string reader_id = 2;
  string operation = 3;
  string pin = 4;
  string new_pin = 5;
  string puk = 6;
}

message AgentEvent {
  oneof event {
    AgentHello hello = 1;
    Heartbeat heartbeat = 2;
    HardwareSnapshot hardware_snapshot = 3;
    CardProfile card_profile = 4;
    SimSession sim_session = 5;
    AkaResult aka_result = 6;
    CommandProgress command_progress = 7;
    CommandResult command_result = 8;
    DeviceStatusEvent device_status = 9;
    PINStatus pin_status = 10;
  }
}

message GetHardwareSnapshotCommand {
  string command_id = 1;
}

message ExecuteHardwareCommand {
  string command_id = 1;
  string device_id = 2;
  string action = 3;
  string payload_json = 4;
  string command_idempotency_key = 5;
}

message CaptureCardProfileCommand {
  string command_id = 1;
  string reader_id = 2;
}

message AcquireSimSessionCommand {
  string command_id = 1;
  string reader_id = 2;
  string expected_iccid = 3;
}

message AuthenticateCommand {
  string command_id = 1;
  string session_id = 2;
  AkaChallenge challenge = 3;
  string expected_iccid = 4;
}

message ReadSmscCommand {
  string command_id = 1;
  string session_id = 2;
}

message CancelCommand {
  string command_id = 1;
  string session_id = 2;
  string target_command_id = 3;
}

message AgentCommand {
  oneof command {
    GetHardwareSnapshotCommand get_hardware_snapshot = 1;
    ExecuteHardwareCommand execute_hardware = 2;
    CaptureCardProfileCommand capture_card_profile = 3;
    AcquireSimSessionCommand acquire_sim_session = 4;
    AuthenticateCommand authenticate = 5;
    ReadSmscCommand read_smsc = 6;
    CancelCommand cancel = 7;
    PINCommand pin = 8;
  }
}

service AgentControl {
  rpc Connect(stream AgentEvent) returns (stream AgentCommand);
}
