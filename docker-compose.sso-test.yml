# Local web/SSO testing on Docker Desktop or OrbStack, without modem devices.
# Build: docker compose -f docker-compose.sso-test.yml build
# Initialize once (reads the admin password from stdin):
#   docker compose -f docker-compose.sso-test.yml run --rm -T \
#     --entrypoint /opt/vonet/bin/vonet vonet bootstrap-admin
# Start: docker compose -f docker-compose.sso-test.yml up -d --wait
# Visit http://127.0.0.1:17575 and use that same origin in SSO settings.
# This loopback HTTP profile exercises private-network HTTP providers and IPv6
# origin handling in tests without presenting the service as a TLS endpoint.
# TLS termination is tested separately with trusted X-Forwarded-Proto and Host;
# production deployments must use HTTPS and secure cookies.
name: vonet-sso-test

services:
  vonet:
    image: vonet:sso-dev
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: 0.1.0-sso-dev
    container_name: vonet-sso-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:17575:17575"
    environment:
      VONET_CONTAINER: docker
      VONET_ADDR: 0.0.0.0:17575
      VONET_DATABASE_PATH: /opt/vonet/data/vonet.db
      VONET_SECURE_COOKIES: "false"
      TZ: Asia/Shanghai
    volumes:
      - vonet-sso-test-data:/opt/vonet/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:17575/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3

volumes:
  vonet-sso-test-data:
    name: vonet-sso-test-data
